name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-xcodegen-${{ runner.os }}
          restore-keys: brew-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: .build
          key: derived-${{ runner.os }}-${{ hashFiles('project.yml', 'Shimbar/**/*.swift') }}
          restore-keys: derived-${{ runner.os }}-

      - name: Build
        run: make build

      - name: Run tests
        run: make test
