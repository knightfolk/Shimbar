name: Shimbar
options:
  bundleIdPrefix: com.shimbar
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    PRODUCT_BUNDLE_IDENTIFIER: com.shimbar.app

targets:
  Shimbar:
    type: application
    platform: macOS
    sources:
      - Shimbar
    settings:
      base:
        INFOPLIST_FILE: Shimbar/Info.plist
        PRODUCT_NAME: Shimbar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  ShimbarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ShimbarTests
    dependencies:
      - target: Shimbar
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Shimbar.app/Contents/MacOS/Shimbar"
